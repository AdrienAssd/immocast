name: CI/CD

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/immocast

jobs:
  tests:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run the test suite
        run: pytest -v

  docker:
    name: Docker build and smoke test
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Create the test model
        run: |
          mkdir -p models
          python -c "from tests.conftest import make_fake_model; make_fake_model('models/model.joblib')"
          echo "EXPECTED_VERSION=$(python -c "from app.model_loader import load_model; print(load_model('models/model.joblib').version)")" >> "$GITHUB_ENV"

      - name: Build the image
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" -t immocast:ci .

      - name: Start the container with the test model
        run: |
          docker run -d --name immocast -p 8000:8000 \
            -v "$PWD/models:/app/models:ro" immocast:ci

      - name: Smoke test the container
        run: |
          python scripts/smoke_test.py --url http://localhost:8000 \
            --expected-version "$EXPECTED_VERSION" --expected-sha "$GITHUB_SHA" --timeout 60

      - name: Container logs
        if: ${{ always() }}
        run: docker logs immocast

  deploy:
    name: Deploy to Render
    needs: docker
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the image tagged with the commit
        run: |
          docker build --build-arg GIT_SHA="$GITHUB_SHA" -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"

      - name: Trigger the Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          IMAGE_URL=$(python -c "import os, urllib.parse; print(urllib.parse.quote('docker.io/' + os.environ['IMAGE'] + ':' + os.environ['GITHUB_SHA'], safe=''))")
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK}&imgURL=${IMAGE_URL}"

      - name: Resolve the expected champion version
        env:
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ vars.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          MODEL_NAME: ${{ vars.MODEL_NAME || 'immocast' }}
        run: |
          python -m pip install "mlflow==2.22.*"
          python - <<'EOF' >> "$GITHUB_ENV"
          import os
          from mlflow.tracking import MlflowClient
          try:
              version = MlflowClient().get_model_version_by_alias(os.environ["MODEL_NAME"], "champion").version
          except Exception:
              version = ""
          print(f"EXPECTED_VERSION={version}")
          EOF

      - name: Smoke test the production URL
        env:
          PROD_URL: ${{ vars.PROD_URL }}
        run: |
          if [ -n "$EXPECTED_VERSION" ]; then
            python scripts/smoke_test.py --url "$PROD_URL" --expected-version "$EXPECTED_VERSION" --expected-sha "$GITHUB_SHA" --timeout 600
          else
            echo "::warning::No champion in the registry yet: checking that the new image is live only."
            for i in $(seq 1 60); do
              SHA=$(curl -fsS "$PROD_URL/model-info" | python -c "import json, sys; print(json.load(sys.stdin).get('git_sha', ''))" || true)
              [ "$SHA" = "$GITHUB_SHA" ] && echo "OK: $PROD_URL runs commit $SHA" && exit 0
              sleep 10
            done
            echo "FAIL: $PROD_URL does not run commit $GITHUB_SHA" && exit 1
          fi
