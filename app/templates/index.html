<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ImmoCast</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f6f8; color: #1d2433; margin: 0; }
    main { max-width: 480px; margin: 48px auto; padding: 0 16px; }
    h1 { margin-bottom: 4px; }
    p.sub { color: #5b6475; margin-top: 0; }
    form { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    label { display: block; font-weight: 600; margin: 12px 0 4px; }
    input { width: 100%; padding: 10px; border: 1px solid #ccd2dc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
    button { margin-top: 20px; width: 100%; padding: 12px; border: 0; border-radius: 8px; background: #2f5bea; color: #fff; font-size: 16px; cursor: pointer; }
    .result, .error { margin-top: 20px; padding: 16px; border-radius: 12px; }
    .result { background: #e8f0ff; }
    .result strong { font-size: 28px; display: block; }
    .error { background: #fde8e8; color: #9b1c1c; }
  </style>
</head>
<body>
<main>
  <h1>ImmoCast</h1>
  <p class="sub">Apartment price estimate in Paris</p>

  <form method="post">
    <label for="surface">Living area (m²)</label>
    <input id="surface" name="surface" type="number" step="0.1" value="{{ form.get('surface', '') }}" required>

    <label for="pieces">Number of rooms</label>
    <input id="pieces" name="pieces" type="number" value="{{ form.get('pieces', '') }}" required>

    <label for="code_postal">Postal code</label>
    <input id="code_postal" name="code_postal" type="text" placeholder="75011" value="{{ form.get('code_postal', '') }}" required>

    <button type="submit">Estimate</button>
  </form>

  {% if result %}
  <div class="result" id="result">
    <strong>€{{ "{:,}".format(result.prix_total) }}</strong>
    i.e. €{{ "{:,}".format(result.prix_m2) }} per m²
  </div>
  {% endif %}

  {% if error %}
  <div class="error" id="error">{{ error }}</div>
  {% endif %}
</main>
</body>
</html>
